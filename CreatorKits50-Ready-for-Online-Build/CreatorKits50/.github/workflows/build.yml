name: Build CreatorKits50

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build with Maven
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean package --batch-mode
          else
            echo "pom.xml not found in root, searching subdirectories..."
            POM_PATH=$(find . -maxdepth 3 -name "pom.xml" -print -quit)
            if [ -n "$POM_PATH" ]; then
              cd $(dirname "$POM_PATH")
              mvn clean package --batch-mode
            else
              echo "Error: pom.xml could not be found!"
              exit 1
            fi
          fi

      - name: Upload Built JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreatorKits50-JAR
          path: '**/target/*.jar'
